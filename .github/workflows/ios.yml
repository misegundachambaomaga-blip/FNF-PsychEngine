name: Build Psych Engine iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, experimental]

permissions:
  contents: read

jobs:
  build-ios:
    name: Compile iOS
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: "4.3.4"

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          chmod +x ./setup/unix.sh
          ./setup/unix.sh

      - name: Skip SScript setup mode
        run: |
          printf '%s' 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Create Version
        run: echo "${GITHUB_RUN_ID}" > VERSION

      - name: Compile iOS
        run: |
          set -o pipefail
          haxelib run lime build ios \
            -nosign \
            --app-version="0.7.3-${GITHUB_RUN_ID}" \
            -D officialBuild 2>&1 | tee ios-build.log

      - name: Package IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find export -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró ninguna aplicación .app"
            find export -maxdepth 6 -print || true
            exit 1
          fi

          mkdir -p dist Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent \
            Payload dist/PsychEngine-iOS.ipa
          rm -rf Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-iOS-IPA
          path: dist/PsychEngine-iOS.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Build-Log
          path: ios-build.log
          if-no-files-found: ignore
          retention-days: 7
